name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production-gke
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  ARTIFACT_BUCKET: ${{ vars.GCP_ARTIFACT_BUCKET }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  GKE_CLUSTER: ${{ vars.GCP_GKE_CLUSTER }}
  GKE_NAMESPACE: nyc-r3s1
  CORS_ORIGIN: https://dbsentinal.get200.qd.je
  CLERK_AUTHORIZED_PARTIES: https://dbsentinal.get200.qd.je
  CLERK_ISSUER: https://clerk.dbsentinal.get200.qd.je
  CLERK_JWKS_URL: https://clerk.dbsentinal.get200.qd.je/.well-known/jwks.json
  ROLLBACKREADY_PRIVILEGED_CLERK_USER_IDS: ${{ vars.ROLLBACKREADY_PRIVILEGED_CLERK_USER_IDS }}
  CLERK_JWT_KEY: "-----BEGIN PUBLIC KEY-----\\\\n-----END PUBLIC KEY-----"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install and test
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip check
          python -m compileall -q app alembic
          python -m ruff check app tests
          python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${GITHUB_SHA}"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Run database migrations
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          gcloud run jobs deploy backend-migrate \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances="${{ vars.GCP_CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ vars.GCP_CLOUD_SQL_CONNECTION_NAME }},IAM_DB_USER=${{ vars.GCP_CLOUD_SQL_IAM_USER }},DB_NAME=app" \
            --command=python \
            --args=-m,alembic,upgrade,head \
            --cpu=1 \
            --memory=512Mi \
            --max-retries=1 \
            --task-timeout=300s \
            --execute-now \
            --wait \
            --quiet

      - name: Deploy autoscaled production backend
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          gcloud run services update nycr3s1-backend \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --min=2 \
            --max=20 \
            --concurrency=3 \
            --cpu=1 \
            --memory=2Gi \
            --timeout=300 \
            --quiet

      - name: Deploy to GKE
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ env.CLERK_JWT_KEY }}
          CLERK_ISSUER: ${{ env.CLERK_ISSUER }}
          CLERK_AUTHORIZED_PARTIES: ${{ env.CLERK_AUTHORIZED_PARTIES }}
          CLERK_JWKS_URL: ${{ env.CLERK_JWKS_URL }}
        run: |
          kubectl create secret generic backend-auth-secrets \
            --namespace="$GKE_NAMESPACE" \
            --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            --from-literal=CLERK_JWT_KEY="$CLERK_JWT_KEY" \
            --dry-run=client --output=yaml | kubectl apply -f -
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/backend-config.yaml
          kubectl apply \
            -f k8s/ingress-service.yaml \
            -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout status deployment/backend \
            --namespace="$GKE_NAMESPACE" --timeout=600s
          test "$(kubectl get hpa backend --namespace="$GKE_NAMESPACE" \
            --output=jsonpath='{.spec.minReplicas}')" = "1"
          test "$(kubectl get hpa backend --namespace="$GKE_NAMESPACE" \
            --output=jsonpath='{.spec.maxReplicas}')" = "20"
          kubectl get deployment/backend hpa/backend \
            --namespace="$GKE_NAMESPACE" --output=wide

      - name: Verify GKE RollbackReady API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://api.r3.get200.qd.je/health/ready"
          last_error = None
          for _ in range(24):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      document = json.load(response)
                  assert document["status"] == "ready"
                  assert document["database"]["connected"] is True
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise SystemExit(f"GKE API did not become ready: {last_error}")
          PY

      - name: Publish GKE ingress URL
        shell: bash
        run: |
          INGRESS_IP="$(kubectl get ingress backend-ingress \
            --namespace="$GKE_NAMESPACE" \
            --output=jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          if [[ -n "$INGRESS_IP" ]]; then
            echo "GKE HTTPS URL - https://api.r3.get200.qd.je ($INGRESS_IP)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GKE HTTPS Ingress is still reconciling." >> "$GITHUB_STEP_SUMMARY"
          fi
