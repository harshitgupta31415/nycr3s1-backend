name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  GKE_CLUSTER: ${{ vars.GCP_GKE_CLUSTER }}
  GKE_NAMESPACE: nyc-r3s1
  CLERK_AUTHORIZED_PARTIES: https://dbsentinal.get200.qd.je
  CLERK_JWKS_URL: https://clerk.dbsentinal.get200.qd.je/.well-known/jwks.json
  CLERK_JWT_KEY: "-----BEGIN PUBLIC KEY-----\\\\n-----END PUBLIC KEY-----"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install and test
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip check
          python -m compileall -q app alembic
          python -m ruff check app tests
          python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${GITHUB_SHA}"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Run database migrations
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          kubectl apply -f k8s/namespace.yaml -f k8s/service-account.yaml
          kubectl delete job backend-migrate \
            --namespace="$GKE_NAMESPACE" --ignore-not-found
          envsubst < k8s/migration-job.yaml | kubectl apply -f -
          if ! kubectl wait --for=condition=complete job/backend-migrate \
            --namespace="$GKE_NAMESPACE" --timeout=300s; then
            kubectl describe job/backend-migrate --namespace="$GKE_NAMESPACE"
            kubectl get pods --namespace="$GKE_NAMESPACE" \
              --selector=job-name=backend-migrate --output=wide
            kubectl logs job/backend-migrate --namespace="$GKE_NAMESPACE" \
              --all-containers=true --tail=200 || true
            exit 1
          fi

      - name: Deploy new Cloud Run revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ steps.image.outputs.uri }}
          env_vars: |-
            INSTANCE_CONNECTION_NAME=${{ vars.GCP_CLOUD_SQL_CONNECTION_NAME }}
            IAM_DB_USER=${{ vars.GCP_CLOUD_SQL_IAM_USER }}
            DB_NAME=app
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            GOOGLE_GENAI_USE_VERTEXAI=true
            GEMINI_MODEL=gemini-3.6-flash
            ROLLBACKREADY_SANDBOX_BACKEND=native
            ROLLBACKREADY_POSTGRES_BIN=/usr/lib/postgresql/18/bin
            ROLLBACKREADY_PERSIST_REPORTS=true
            ROLLBACKREADY_TOTAL_RUNTIME_SECONDS=90
            ROLLBACKREADY_MAX_TOTAL_ROWS=10000
            ROLLBACKREADY_MAX_ACTIVE_ANALYSES=25
            ROLLBACKREADY_CREATE_RATE_LIMIT_PER_MINUTE=10
            CLERK_JWT_KEY=${{ env.CLERK_JWT_KEY }}
            CLERK_AUTHORIZED_PARTIES=${{ env.CLERK_AUTHORIZED_PARTIES }}
            CLERK_JWKS_URL=${{ env.CLERK_JWKS_URL }}
            CLERK_AUTH_MODE=required
            CLERK_AUTH_REQUIRED=true
          flags: >-
            --port=8080
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=2Gi
            --concurrency=1
            --min-instances=1
            --max-instances=1

      - name: Verify deployed RollbackReady API
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ["SERVICE_URL"].rstrip("/")
          last_error = None
          for _ in range(12):
              try:
                  with urllib.request.urlopen(f"{base_url}/openapi.json", timeout=15) as response:
                      document = json.load(response)
                  assert document["info"]["title"] == "RollbackReady API"
                  assert document["info"]["version"] == "0.3.0"
                  assert "/api/v1/analyses" in document["paths"]
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise SystemExit(f"deployed API did not become current: {last_error}")
          PY

      - name: Bind Cloud Run Clerk secret from Secret Manager
        shell: bash
        run: |
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --remove-env-vars=CLERK_SECRET_KEY \
            --update-secrets=CLERK_SECRET_KEY=nycr3s1-clerk-secret-key:latest \
            --quiet

      - name: Deploy to GKE
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ env.CLERK_JWT_KEY }}
          CLERK_AUTHORIZED_PARTIES: ${{ env.CLERK_AUTHORIZED_PARTIES }}
          CLERK_JWKS_URL: ${{ env.CLERK_JWKS_URL }}
        run: |
          kubectl create secret generic backend-auth-secrets \
            --namespace="$GKE_NAMESPACE" \
            --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            --from-literal=CLERK_JWT_KEY="$CLERK_JWT_KEY" \
            --dry-run=client --output=yaml | kubectl apply -f -
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/backend-config.yaml
          kubectl apply \
            -f k8s/service.yaml \
            -f k8s/ingress-service.yaml \
            -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout status deployment/backend \
            --namespace="$GKE_NAMESPACE" --timeout=300s

      - name: Publish service URL
        shell: bash
        run: |
          echo "Cloud Run URL - ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          for _ in {1..36}; do
            GKE_IP="$(kubectl get service backend-public \
              --namespace="$GKE_NAMESPACE" \
              --output=jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [[ -n "$GKE_IP" ]]; then
              echo "GKE rollback URL - http://$GKE_IP" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 5
          done
          INGRESS_IP="$(kubectl get ingress backend-ingress \
            --namespace="$GKE_NAMESPACE" \
            --output=jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          if [[ -n "$INGRESS_IP" ]]; then
            echo "GKE HTTPS URL - https://api.r3.get200.qd.je ($INGRESS_IP)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GKE HTTPS Ingress is still reconciling." >> "$GITHUB_STEP_SUMMARY"
          fi
