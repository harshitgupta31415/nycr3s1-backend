apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nyc-r3s1
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: nycr3s1
spec:
  # Raw artifacts exist only in this process until the synchronous run/plan
  # lifecycle ends, so the anonymous MVP deliberately uses one control pod.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: nycr3s1
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: INSTANCE_CONNECTION_NAME
              value: nychacksishv-core-20260808:asia-south1:nycr3s1-postgres
            - name: IAM_DB_USER
              value: nycr3s1-backend-runtime@nychacksishv-core-20260808.iam
            - name: DB_NAME
              value: app
            - name: GOOGLE_CLOUD_PROJECT
              value: nychacksishv-core-20260808
            - name: GOOGLE_CLOUD_LOCATION
              value: global
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GEMINI_MODEL
              value: gemini-3.6-flash
            - name: ROLLBACKREADY_SANDBOX_BACKEND
              value: native
            - name: ROLLBACKREADY_POSTGRES_BIN
              value: /usr/lib/postgresql/18/bin
            - name: ROLLBACKREADY_PERSIST_REPORTS
              value: "true"
            - name: ROLLBACKREADY_TOTAL_RUNTIME_SECONDS
              value: "90"
            - name: ROLLBACKREADY_MAX_TOTAL_ROWS
              value: "10000"
            - name: ROLLBACKREADY_MAX_ACTIVE_ANALYSES
              value: "25"
            - name: ROLLBACKREADY_CREATE_RATE_LIMIT_PER_MINUTE
              value: "10"
            - name: CLERK_AUTH_MODE
              value: "required"
            - name: CLERK_AUTH_REQUIRED
              value: "true"
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-auth-secrets
                  key: CLERK_SECRET_KEY
            - name: CLERK_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-auth-secrets
                  key: CLERK_JWT_KEY
            - name: CLERK_JWKS_URL
              value: "${CLERK_JWKS_URL}"
            - name: CLERK_AUTHORIZED_PARTIES
              value: "${CLERK_AUTHORIZED_PARTIES}"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
              ephemeral-storage: 1536Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 1Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
